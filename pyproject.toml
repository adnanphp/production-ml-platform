[project]
name = "production-ml-platform"
version = "0.1.0"
description = "Evaluation gate, registry, canary serving, drift detection, rollback."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
